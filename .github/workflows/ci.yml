# ST-BMSE: CI on every push / pull request, CD to GitHub Container Registry on the default branch.
#
#   ci  -> install, train (MLflow tracking + QUALITY GATE), audits + Evidently drift report, pytest,
#          docker build, run the container and curl it
#   cd  -> only on a push to main/master AND only if ci passed: build and push the image to ghcr.io
#
# The quality gate is the exit code of `python run_pipeline.py`: if the trained model does not beat the persistence
# baseline by the required margin on VALIDATION data, the step fails and nothing after it runs (so nothing is published).
# Pattern follows fraud_mlops/ in the lab repository (train -> gate -> test -> docker -> push).
#
# This file expects the repository root to be the ThreatGuard_STBMSE folder.
name: stbmse-ci-cd

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Train, quality gate, audits and Evidently drift report
        # --fast: fewer bootstrap / permutation repeats (point metrics are identical, only CIs differ slightly)
        # exits 1 if the quality gate fails, which stops the job here
        run: python run_pipeline.py --fast

      - name: Test
        run: python -m pytest -q

      - name: Keep the reports, drift report and MLflow store
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stbmse-reports
          path: |
            reports/
            artifacts/metrics.json
            mlflow.db
          if-no-files-found: ignore

      - name: Build Docker image
        run: docker build -t stbmse-api:ci .

      - name: Run the container and call it
        run: |
          docker run -d --name stbmse-api -p 8000:8000 stbmse-api:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"county":"Nairobi","year":2024,"month":12}'
          echo
          # the browser UI must be served by the same container
          curl -fsS http://127.0.0.1:8000/ui | grep -q "County escalation outlook"
          curl -fsS http://127.0.0.1:8000/periods
          echo
          # invalid input must be rejected with HTTP 422
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"county":"Nairobi","year":2024,"month":13}')" = "422"

      - name: Container logs on failure
        if: failure()
        run: docker logs stbmse-api || true

  cd:
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}     # built-in token; no secret to create

      - name: Image name (registry names must be lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stbmse-api" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
